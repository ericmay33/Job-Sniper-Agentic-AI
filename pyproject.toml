[project]
name = "jobsniper"
version = "0.1.0"
description = "Stateful job-search pipeline: discovery, filtering, contact resolution, grounded outreach with human approval."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
]

[project.scripts]
jobsniper = "jobsniper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobsniper"]

# `native-tls` is required on this machine: TLS interception means uv must trust
# the Windows certificate store rather than its bundled roots.
[tool.uv]
system-certs = true

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.18",
    "pytest>=8.4",
    "pre-commit>=4.3",
    "detect-secrets>=1.5",
]

# --- lint / format -----------------------------------------------------------
# target-version is intentionally unset: ruff infers py312 from requires-python,
# so the code stays 3.12-compatible even though it runs on 3.14 locally.
[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PT", "RUF"]
ignore = ["E501"]  # the formatter owns line length

# --- types -------------------------------------------------------------------
# strict everywhere, then relaxed per-module. mypy only allows `strict` in the
# global section, so "strict on models/ and db/, normal elsewhere" is expressed
# as strict-then-loosen rather than the other way around.
[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = [
    "jobsniper.discovery.*",
    "jobsniper.eval.*",
    "jobsniper.cli",
    "tests.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
warn_return_any = false

# --- tests -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: needs a reachable DATABASE_URL; skipped when the server is not up",
]
